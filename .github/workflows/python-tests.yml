name: Numerical verification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-lock.txt

      - name: Run mathematical and regression tests
        run: python -m unittest discover -s tests -v

      - name: Check notebook synchronization
        run: python build_notebook.py --check

      - name: Verify committed artifacts
        run: python verify_manifest.py

      - name: Preserve reference numerical results
        run: cp -r results/tables "$RUNNER_TEMP/fso_reference_tables"

      - name: Regenerate full experiments
        run: python run_study.py
        env:
          FAST_MODE: '0'

      - name: Compare regenerated numerical results
        run: python compare_results.py "$RUNNER_TEMP/fso_reference_tables" results/tables

      - name: Verify regenerated artifacts
        run: python verify_manifest.py

