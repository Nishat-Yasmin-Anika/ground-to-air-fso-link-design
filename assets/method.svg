<g transform="translate(614 22)"><rect width="263" height="199" rx="16" fill="#FFF" stroke="#D6E4EB"/><rect x="17" y="17" width="38" height="38" rx="12" fill="#FAEDE1"/><path d="M25 45L32 37L38 40L46 28" stroke="#C7893C" stroke-width="2.8" fill="none"/><text x="69" y="44" fill="#14435C" font-size="13" font-weight="700">03  PROBABILITY</text><text x="17" y="95" fill="#142B3A" font-size="19" font-weight="700">Link availability</text><text x="17" y="121" fill="#5D7380" font-size="13">Exact finite-state</text><text x="17" y="140" fill="#5D7380" font-size="13">probabilities, checked</text><text x="17" y="159" fill="#5D7380" font-size="13">against simulation</text><text x="17" y="188" fill="#C7893C" font-size="15">P (power ≥ threshold)</text></g>
