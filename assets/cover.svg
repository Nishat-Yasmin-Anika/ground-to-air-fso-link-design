<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 544" role="img" aria-labelledby="heading subheading">
<title id="heading">Free-space optical link design research cover</title><desc id="subheading">A laser link passing between atmospheric layers and a high-altitude aerial platform, with an abstract receiver pattern.</desc>
