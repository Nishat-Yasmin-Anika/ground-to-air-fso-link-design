  <radialGradient id="halo"><stop offset="0" stop-color="#70E2E3" stop-opacity=".23"/><stop offset="1" stop-color="#70E2E3" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#86B6C9" stroke-width=".8" opacity=".07"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="11"/></filter>
</defs>
